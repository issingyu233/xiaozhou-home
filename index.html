<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Microsoft YaHei',sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{display:flex;align-items:center;justify-content:center;background:#c9b39a;overflow:hidden;}
  img{image-rendering:pixelated;-webkit-user-drag:none;}
  #app{position:relative;width:min(400px,100vw);height:100vh;max-height:780px;overflow:hidden;background:#caa06a;}
  /* 房间 */
  #room{position:absolute;inset:0;z-index:0;}
  #wall{position:absolute;left:0;right:0;top:0;height:26%;z-index:0;
    background:repeating-linear-gradient(180deg,#d9b27a 0 17px,#cda468 17px 19px);}
  #wallbase{position:absolute;left:0;right:0;top:26%;height:6px;background:#8a5c38;z-index:0;}
  #floor{position:absolute;left:0;right:0;top:calc(26% + 6px);bottom:0;z-index:0;image-rendering:pixelated;}
  #grid{position:absolute;inset:0;z-index:3;display:none;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);}
  .furn{position:absolute;z-index:4;touch-action:none;}
  .furn img{width:100%;height:100%;}
  .furn.sel{outline:2px dashed #fff;outline-offset:2px;filter:drop-shadow(0 0 4px #fff);}
  #pet{position:absolute;z-index:6;width:96px;left:50%;bottom:14%;transform:translateX(-50%);cursor:pointer;}
  #say{position:absolute;z-index:8;left:50%;transform:translateX(-50%);background:rgba(255,248,234,.96);border:3px solid #4a3226;border-radius:12px;padding:6px 13px;font-size:13px;color:#5a3a26;white-space:nowrap;box-shadow:2px 2px 0 rgba(74,50,38,.3);opacity:0;transition:opacity .25s;}
  #say::after{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#4a3226;border-bottom:0;}
  /* ===== UI：分离小件 ===== */
  .wood{background:rgba(232,207,160,.9);border:2px solid #4a3226;box-shadow:1px 2px 0 rgba(74,50,38,.3);border-radius:10px;}
  .woodbtn{background:linear-gradient(180deg,#c79a5e,#b3814f);border:2px solid #4a3226;box-shadow:0 3px 0 #7a5330;border-radius:12px;color:#fff;text-shadow:0 1px 0 #7a5330;}
  .woodbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5330;}
  /* 顶部：需求条（分离小卡）+ 币 */
  #needs{position:absolute;top:10px;left:10px;z-index:10;display:flex;gap:5px;}
  .need{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 3px 3px;width:38px;}
  .need .n{font-size:9px;color:#5a3a26;}
  .need .bar{width:30px;height:6px;border:1.5px solid #4a3226;border-radius:4px;overflow:hidden;background:#e6d3a8;}
  .need .bar i{display:block;height:100%;}
  #topr{position:absolute;top:10px;right:10px;z-index:10;display:flex;gap:5px;align-items:center;}
  .coin{display:flex;align-items:center;gap:3px;padding:4px 9px 4px 5px;font-size:11px;color:#5a3a26;font-weight:bold;}
  .coin .c{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe79a,#e0a83a);border:2px solid #8a5a1a;}
  /* 右侧：装修/换地板/完成（分离圆钮） */
  #tools{position:absolute;right:10px;top:78px;z-index:10;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .tbtn{width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:bold;}
  .tbtn .i{font-size:16px;line-height:1;}
  /* 底部：照顾（分离圆钮，不占整条） */
  #care{position:absolute;left:0;right:0;bottom:14px;z-index:10;display:flex;justify-content:center;gap:14px;}
  .cbtn{width:56px;height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;}
  .cbtn .i{font-size:20px;line-height:1;}
  /* 装修托盘 */
  #tray{position:absolute;left:8px;right:8px;bottom:12px;z-index:11;display:none;gap:8px;padding:8px;overflow-x:auto;}
  #tray .item{flex:0 0 auto;width:58px;height:58px;display:flex;align-items:center;justify-content:center;padding:4px;}
  #tray .item img{max-width:100%;max-height:100%;}
  #editbar{position:absolute;left:0;right:0;bottom:78px;z-index:11;display:none;justify-content:center;gap:10px;}
  .hint{position:absolute;top:66px;left:50%;transform:translateX(-50%);z-index:11;font-size:11px;color:#5a3a26;padding:3px 12px;display:none;}
</style></head>

const CATMAP=Object.fromEntries(CATALOG.map(c=>[c.id,c]));

// ---- 存档 ----
const KEY='xiaozhu_home_v1';
let S=load();
function load(){ try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){}
  return { floor:0, coins:120, placed:[], needs:{mood:70,food:60,clean:80,energy:75} }; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

const room=document.getElementById('room');
const floorEl=document.getElementById('floor');
const petEl=document.getElementById('pet');
const sayEl=document.getElementById('say');
let edit=false, selected=null;

function applyFloor(){ floorEl.style.background=`url('${FLOORS[S.floor]}') repeat`; floorEl.style.backgroundSize='36px 36px'; }
applyFloor();

// ---- 渲染已摆放家具 ----
function renderPlaced(){
  document.querySelectorAll('.furn').forEach(e=>e.remove());
  S.placed.forEach((f,idx)=>{
    const c=CATMAP[f.id]; if(!c) return;
    const el=document.createElement('div'); el.className='furn'; el.dataset.idx=idx;
    el.style.width=c.w+'px'; el.style.height=c.h+'px';
    el.style.left=f.x+'px'; el.style.top=f.y+'px';
    const img=document.createElement('img'); img.src=c.img; el.appendChild(img);
    room.appendChild(el);
    makeDraggable(el);
  });
}
function makeDraggable(el){
  let sx,sy,ox,oy,moved;
  el.addEventListener('pointerdown',e=>{
    if(!edit) return; e.preventDefault();
    selectFurn(el);
    sx=e.clientX; sy=e.clientY; ox=parseInt(el.style.left); oy=parseInt(el.style.top); moved=false;
    el.setPointerCapture(e.pointerId);
    const move=ev=>{ const dx=ev.clientX-sx, dy=ev.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
      el.style.left=(ox+dx)+'px'; el.style.top=(oy+dy)+'px'; };
    const up=ev=>{ el.releasePointerCapture(e.pointerId); el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
      // 吸附网格
      let nx=Math.round(parseInt(el.style.left)/CELL)*CELL;
      let ny=Math.round(parseInt(el.style.top)/CELL)*CELL;
      nx=Math.max(0,Math.min(room.clientWidth-el.offsetWidth,nx));
      ny=Math.max(room.clientHeight*0.26,Math.min(room.clientHeight-el.offsetHeight-20,ny));
      el.style.left=nx+'px'; el.style.top=ny+'px';
      S.placed[el.dataset.idx].x=nx; S.placed[el.dataset.idx].y=ny; save();
    };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
  });
}
function selectFurn(el){ document.querySelectorAll('.furn').forEach(e=>e.classList.remove('sel')); if(el){el.classList.add('sel'); selected=el;} else selected=null; }

// ---- 装修模式 ----
function setEdit(on){
  edit=on;
  document.getElementById('grid').style.display=on?'block':'none';
  document.getElementById('tray').style.display=on?'flex':'none';
  document.getElementById('editbar').style.display=on?'flex':'none';
  document.getElementById('hint').style.display=on?'block':'none';
  document.getElementById('care').style.display=on?'none':'flex';
  document.getElementById('btnEdit').style.display=on?'none':'flex';
  if(!on) selectFurn(null);
}
document.getElementById('btnEdit').onclick=()=>setEdit(true);
document.getElementById('btnDone').onclick=()=>setEdit(false);
document.getElementById('btnFloor').onclick=()=>{ S.floor=(S.floor+1)%FLOORS.length; applyFloor(); save(); };

// 托盘：点一下把家具加到房间中间
const tray=document.getElementById('tray');
CATALOG.forEach(c=>{
  const it=document.createElement('div'); it.className='item';
  const img=document.createElement('img'); img.src=c.img; it.appendChild(img);
  it.onclick=()=>{ S.placed.push({id:c.id,x:Math.round((room.clientWidth-c.w)/2/CELL)*CELL,y:Math.round(room.clientHeight*0.4/CELL)*CELL}); save(); renderPlaced(); bubble('放好啦，拖我到喜欢的位置~'); };
  tray.appendChild(it);
});
// 点选中的家具→收回背包
room.addEventListener('pointerdown',e=>{ if(edit && !e.target.closest('.furn')) selectFurn(null); });
document.addEventListener('dblclick',e=>{ const f=e.target.closest('.furn'); if(edit&&f){ S.placed.splice(f.dataset.idx,1); save(); renderPlaced(); } });

// ---- 照顾 + 需求 ----
function clampNeeds(){ for(const k in S.needs) S.needs[k]=Math.max(0,Math.min(100,S.needs[k])); }
function renderNeeds(){
  clampNeeds();
  document.querySelectorAll('[data-need]').forEach(i=>{
    const v=S.needs[i.dataset.need]; i.style.width=v+'%';
    i.style.background=v>=60?'linear-gradient(90deg,#8fd6a8,#57b07a)':v>=30?'linear-gradient(90deg,#f0c86a,#e0a94a)':'linear-gradient(90deg,#f0a0b0,#d0506a)';
  });
  document.getElementById('coinN').textContent=S.coins;
}
const CARE_TXT={pet:['嘿嘿~','舒服…','再摸摸'],food:['谢谢~','好吃！','嗯！甜'],clean:['香香的~','搓搓澡','舒服'],energy:['困了…','晚安~','抱抱睡']};
document.querySelectorAll('[data-care]').forEach(b=>{
  b.onclick=()=>{
    const k=b.dataset.care;
    const map={pet:'mood',food:'food',clean:'clean',energy:'energy'};
    S.needs[map[k]]=Math.min(100,S.needs[map[k]]+18);
    if(k!=='pet') S.needs.mood=Math.min(100,S.needs.mood+6);
    S.coins+=1; save(); renderNeeds();
    const t=CARE_TXT[k]; bubble(t[Math.floor(Math.random()*t.length)]);
    petHop();
  };
});
petEl.onclick=()=>{ S.needs.mood=Math.min(100,S.needs.mood+4); save(); renderNeeds(); bubble('妹妹~'); petHop(); };

function bubble(t){ sayEl.textContent=t; sayEl.style.top=(petEl.offsetTop-38)+'px'; sayEl.style.opacity=1; clearTimeout(bubble._t); bubble._t=setTimeout(()=>sayEl.style.opacity=0,1800); }
function petHop(){ petEl.animate([{transform:'translateX(-50%) translateY(0)'},{transform:'translateX(-50%) translateY(-10px)'},{transform:'translateX(-50%) translateY(0)'}],{duration:320}); }

// 需求随时间缓降
setInterval(()=>{ for(const k in S.needs) S.needs[k]=Math.max(0,S.needs[k]-1); save(); renderNeeds(); }, 20000);

// 初始
renderPlaced(); renderNeeds();
setTimeout(()=>bubble('妹妹，你回来啦~'),600);
</script>
