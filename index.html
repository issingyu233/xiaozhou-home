<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>夏以昼喂养模拟器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ===== 房间 ===== -->
  <div id="room">
    <div id="wall"></div>
    <!-- 窗户 + 窗帘 -->
    <div id="window">
      <div class="sky"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="pane v"></div>
      <div class="pane h"></div>
      <div class="sill"></div>
    </div>
    <div class="curtain l"></div>
    <div class="curtain r"></div>
    <div id="wallbase"></div>
    <!-- 地板 -->
    <div id="floor"></div>
    <div id="rug"></div>
    <div id="grid"></div>
    <!-- 家具动态插入 -->
    <img id="pet" src="xiaozhu.png" alt="小昼">
    <div id="say"></div>
  </div>

  <!-- ===== 顶部：需求 + 金币 ===== -->
  <div id="needs">
    <div class="need panel"><span class="ico" data-ico="mood"></span><div class="bar"><i data-need="mood"></i></div></div>
    <div class="need panel"><span class="ico" data-ico="food"></span><div class="bar"><i data-need="food"></i></div></div>
    <div class="need panel"><span class="ico" data-ico="clean"></span><div class="bar"><i data-need="clean"></i></div></div>
    <div class="need panel"><span class="ico" data-ico="energy"></span><div class="bar"><i data-need="energy"></i></div></div>
  </div>
  <div id="topr">
    <div class="coin panel"><span class="ico" data-ico="coin"></span><span id="coinN">120</span></div>
  </div>

  <!-- ===== 右侧工具 ===== -->
  <div id="tools">
    <button class="tbtn panel" id="btnEdit"><span class="ico" data-ico="hammer"></span><span class="lbl">装修</span></button>
  </div>
  <div class="hint panel" id="hint">装修中 · 拖动家具摆放 · 双击家具收回</div>
  <div id="editbar">
    <button class="tbtn panel" id="btnFloor"><span class="ico" data-ico="brush"></span><span class="lbl">换地板</span></button>
    <button class="tbtn panel" id="btnDone"><span class="ico" data-ico="check"></span><span class="lbl">完成</span></button>
  </div>
  <div id="tray" class="panel"></div>

  <!-- ===== 底部照料 ===== -->
  <div id="care">
    <button class="cbtn panel" data-care="pet"><span class="ico" data-ico="paw"></span><span class="lbl">摸摸</span></button>
    <button class="cbtn panel" data-care="food"><span class="ico" data-ico="apple"></span><span class="lbl">喂食</span></button>
    <button class="cbtn panel" data-care="clean"><span class="ico" data-ico="drop"></span><span class="lbl">洗澡</span></button>
    <button class="cbtn panel" data-care="energy"><span class="ico" data-ico="moon"></span><span class="lbl">哄睡</span></button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
