<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>夏以昼喂养模拟器</title>
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<div id="app">
  <!-- ===== 房间 ===== -->
  <div id="room">
    <div id="wall"></div>
    <div id="wallbase"></div>
    <div id="floor"></div>
    <div id="grid"></div>
    <!-- 家具动态插入 -->
    <img id="pet" src="xiaozhou.png" alt="小昼">
    <div id="say"></div>
    <!-- 选中家具的操作条 -->
    <div id="selbar">
      <button class="sb" data-act="flip">翻转</button>
      <button class="sb" data-act="rot">旋转</button>
      <button class="sb del" data-act="del">收回</button>
    </div>
  </div>

  <!-- ===== 顶部：需求 + 金币（各合成一张卡）===== -->
  <div id="needs" class="panel">
    <div class="need"><span class="ico" data-ico="mood"></span><div class="bar"><i data-need="mood"></i></div></div>
    <div class="need"><span class="ico" data-ico="food"></span><div class="bar"><i data-need="food"></i></div></div>
    <div class="need"><span class="ico" data-ico="clean"></span><div class="bar"><i data-need="clean"></i></div></div>
    <div class="need"><span class="ico" data-ico="energy"></span><div class="bar"><i data-need="energy"></i></div></div>
  </div>
  <div id="topr" class="panel">
    <span class="res"><span class="ico" data-ico="coin"></span><span id="coinN">120</span></span>
    <span class="res"><span class="ico" data-ico="gem"></span><span id="gemN">5</span></span>
  </div>

  <!-- 成长阶段徽章 -->
  <div id="growth" class="panel">
    <span class="gspr">🌱</span>
    <span class="gtxt">
      <span class="gname">幼崽</span>
      <span class="gbar"><i></i></span>
    </span>
  </div>

  <!-- 换房间：顶部居中小标头 -->
  <div id="roomsel" class="panel">
    <span class="arw" id="arwL"><span class="ico" data-ico="arwL"></span></span>
    <span class="rtag" id="roomName">🛏 卧室</span>
    <span class="arw" id="arwR"><span class="ico" data-ico="arwR"></span></span>
  </div>

  <!-- 右侧：装修 / 商店 / 完成 -->
  <button class="tbtn panel" id="btnEdit"><span class="ico" data-ico="hammer"></span><span class="lbl">装修</span></button>
  <button class="tbtn side panel" id="btnShop"><span class="nb">NEW</span><span class="ico" data-ico="cart"></span><span class="lbl">商店</span></button>
  <button class="tbtn panel" id="btnDone"><span class="ico" data-ico="check"></span><span class="lbl">完成</span></button>
  <div class="hint panel" id="hint">拖动家具或小昼摆放 · 点一下家具可翻转/旋转</div>

  <!-- 装修托盘：分类 + 内容 -->
  <div id="tray" class="panel">
    <div id="cats"></div>
    <div id="items"></div>
  </div>

  <!-- ===== 底部照料 ===== -->
  <div id="care">
    <button class="cbtn panel" data-care="pet"><span class="ico" data-ico="paw"></span><span class="lbl">摸摸</span></button>
    <button class="cbtn panel" data-care="food"><span class="ico" data-ico="apple"></span><span class="lbl">喂食</span></button>
    <button class="cbtn panel" data-care="clean"><span class="ico" data-ico="drop"></span><span class="lbl">洗澡</span></button>
    <button class="cbtn panel" data-care="energy"><span class="ico" data-ico="moon"></span><span class="lbl">哄睡</span></button>
  </div>

  <!-- ===== 商店 ===== -->
  <div id="shop">
    <div class="shopbox">
      <div class="shead">
        <span class="stitle">🛒 商店</span>
        <span class="sbal panel"><span class="ico" data-ico="coin"></span><span id="shopCoin">200</span></span>
        <button id="shopClose">✕</button>
      </div>
      <div id="shopitems"></div>
      <div id="shopmsg"></div>
    </div>
  </div>

  <!-- ===== 每日签到 ===== -->
  <div id="checkin">
    <div class="cibox">
      <div class="cihead">
        <span class="cititle">🗓 每日签到</span>
        <button id="checkinClose">✕</button>
      </div>
      <div class="citip">每天来看看小昼，就有金币可以拿~ 连签 7 天还有钻石！</div>
      <div id="checkinDays"></div>
      <div id="checkinFoot">
        <span class="cistreak">已连续陪伴小昼 0 天</span>
        <button id="checkinBtn">领取今日奖励</button>
      </div>
    </div>
  </div>

  <!-- ===== 日记（心情日历 + 日记本 两个子视图）===== -->
  <div id="moodpage">
    <div class="mbox">
      <div class="mhead">
        <span class="mtitle">日记</span>
        <button id="moodClose">✕</button>
      </div>
      <div class="mtabs">
        <span class="mtab on" data-dtab="cal">心情日历</span>
        <span class="mtab" data-dtab="list">日记本</span>
      </div>
      <div id="calView">
        <div class="mnav">
          <span class="marw" id="moodPrev"><span class="ico" data-ico="arwL"></span></span>
          <span class="mmon" id="moodMon">2026 年 8 月</span>
          <span class="marw" id="moodNext"><span class="ico" data-ico="arwR"></span></span>
        </div>
        <div class="mweek"><i>一</i><i>二</i><i>三</i><i>四</i><i>五</i><i>六</i><i>日</i></div>
        <div id="moodGrid"></div>
        <div id="moodFoot"></div>
      </div>
      <div id="listView">
        <div id="diaryList"></div>
      </div>
    </div>
  </div>

  <!-- ===== 衣柜换装（整页）===== -->
  <div id="closet" class="fullpage">
    <div class="fphead">
      <span class="fptitle">👗 衣柜</span>
      <button id="closetClose" class="fpclose">✕</button>
    </div>
    <div class="ctip">给小昼戴上喜欢的小饰品~</div>
    <div id="closetItems"></div>
  </div>

  <!-- ===== 我的（陪伴数据 + 小昼日记设置 + 聊天）===== -->
  <div id="mepage" class="fullpage">
    <div class="fphead">
      <span class="fptitle">🏡 我的</span>
      <button id="meClose" class="fpclose">✕</button>
    </div>
    <div id="meBody">
      <div class="mecard" id="meStats"></div>

      <button class="mebtn" id="openChat"><span>💬 和小昼聊天</span><span class="mearw">›</span></button>

      <div class="mecard">
        <div class="mesec">小昼的日记 · AI</div>
        <div class="mehint">填入你自己的 DeepSeek API Key（只存在你这台设备的浏览器里，不会上传、不进代码）。填好后小昼就能以他的口吻回复/写日记、陪你聊天；不填则用本地暖心话兜底。</div>
        <label class="melab">API Key</label>
        <input id="aiKey" class="mein" type="password" placeholder="sk-..." autocomplete="off">
        <label class="melab">模型</label>
        <input id="aiModel" class="mein" type="text" placeholder="deepseek-chat">
        <label class="metog"><input type="checkbox" id="aiEnabled"> 启用小昼 AI</label>
        <label class="metog"><input type="checkbox" id="aiAuto"> 写完日记自动让小昼回复</label>
        <div class="mebtns">
          <button id="aiTest" class="mesmall">测试连接</button>
          <button id="aiSave" class="mesmall primary">保存</button>
        </div>
        <div id="aiStatus" class="mestatus"></div>
      </div>
    </div>
  </div>

  <!-- ===== 和小昼聊天 ===== -->
  <div id="chat" class="fullpage">
    <div class="fphead">
      <span class="fptitle">💬 小昼</span>
      <button id="chatClose" class="fpclose">✕</button>
    </div>
    <div id="chatLog"></div>
    <div id="chatBar">
      <input id="chatIn" type="text" maxlength="200" placeholder="和小昼说点什么…">
      <button id="chatSend">发送</button>
    </div>
  </div>

  <!-- ===== 底部导航 ===== -->
  <div id="nav">
    <div class="n on" data-nav="home"><span class="ico" data-ico="home"></span>家</div>
    <div class="n" data-nav="mood"><span class="ico" data-ico="book"></span>日记</div>
    <div class="n" data-nav="closet"><span class="ico" data-ico="hanger"></span>衣柜</div>
    <div class="n" data-nav="me"><span class="ico" data-ico="person"></span>我的</div>
  </div>
</div>
<script src="game.js?v=12"></script>
</body>
</html>
